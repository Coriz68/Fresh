get('#print').onclick=()=>{if(printable()){paint();window.print();}};
window.addEventListener('beforeprint',paint);
get('#newOrder').onclick=()=>{if(!confirm('Creare un ordine vuoto? Conserva il JSON dell’ordine corrente prima di proseguire.'))return;data={};dirty=false;updateDraft();renderFields();statusMessage('Nuovo ordine.');};
get('#highlights').onchange=e=>document.body.classList.toggle('clean',!e.target.checked);
function resize() {
  const scale=fullSize?1:Math.min(1,get('.viewport').clientWidth/model.width);
  get('.sheet').style.transform='scale('+scale+')';get('.stage').style.width=model.width*scale+'px';get('.stage').style.height=model.height*scale+'px';
}
get('#zoom').onclick=()=>{fullSize=!fullSize;get('#zoom').textContent=fullSize?'Adatta alla finestra':'Dimensione 100%';resize();};
window.addEventListener('resize',resize);
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
fields.forEach(addField);
try { const saved=localStorage.getItem(storeKey);if(saved){data=normalize(JSON.parse(saved));statusMessage('Bozza del modello recuperata.');} } catch {}
renderFields();resize();
const quoteManagerChannel = 'area-tenda-quote-manager';
window.addEventListener('message', async event => {
  const message = event.data;
  if (event.source !== window.parent || event.origin !== window.location.origin || !message || message.channel !== quoteManagerChannel || !message.requestId) return;
  const reply = (type, payload = {}) => event.source.postMessage({channel:quoteManagerChannel,type,requestId:message.requestId,...payload},event.origin);
  try {
    if (message.type === 'set-data') {
      const incoming = message.data && typeof message.data === 'object' && !Array.isArray(message.data) ? message.data : {};
      data = normalize({...fileData(),dati:incoming});
      dirty = false;
      updateDraft();
      renderFields();
      statusMessage('Dati caricati dal preventivo.');
      reply('module-ready');
    } else if (message.type === 'get-data') {
      const snapshot={...data}; dirty=false; updateDraft(); reply('module-data',{data:snapshot});
    } else if (message.type === 'get-pdf') {
      if (!printable()) throw Error(get('#status').textContent || 'Completa i campi obbligatori del modulo.');
      const bytes = await makePDF();
      const buffer = bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
      event.source.postMessage({channel:quoteManagerChannel,type:'module-pdf',requestId:message.requestId,bytes:buffer},event.origin,[buffer]);
    } else if (message.type === 'build-quote-pdf') {
      if (typeof window.buildQuotePdfDocument !== 'function') throw Error('Generatore PDF non disponibile nel modulo.');
      const bytes = await window.buildQuotePdfDocument(message.payload,message.modulePdfs);
      const buffer = bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
      event.source.postMessage({channel:quoteManagerChannel,type:'quote-pdf',requestId:message.requestId,bytes:buffer},event.origin,[buffer]);
    }
  } catch (error) {
    reply('module-error',{error:error?.message || String(error)});
  }
});
</script></body></html>
