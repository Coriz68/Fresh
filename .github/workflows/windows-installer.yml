name: Windows installer 1.0

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sorgenti
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa dipendenze
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Verifica test Python e JavaScript
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          Get-ChildItem tests -Filter *.js | ForEach-Object { node --test $_.FullName }

      - name: Compila applicazione Windows
        run: python -m PyInstaller --noconfirm --clean packaging/windows/GestionalePreventivi.spec

      - name: Verifica file dell'applicazione
        shell: pwsh
        run: |
          $app = Resolve-Path "dist/GestionalePreventivi"
          if (-not (Test-Path "$app/GestionalePreventivi.exe")) { throw "Eseguibile non trovato" }
          $contents = Join-Path $app "_internal"
          if (-not (Test-Path $contents)) { throw "Cartella dati PyInstaller mancante" }
          if ((Get-ChildItem "$contents/Moduli" -Filter *.html).Count -ne 32) { throw "Numero moduli HTML inatteso" }
          foreach ($file in @("Gestione_preventivi.html", "Apri_catalogo.html", "gestionale.js", "gestionale-pdf.js", "Disegni/Sezione_H1_H2.jpeg", "Logo_BN_Trasp_HD.png")) {
            if (-not (Test-Path "$contents/$file")) { throw "File applicativo mancante: $file" }
          }

      - name: Installa Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Crea installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler non trovato" }
          & $iscc "packaging/windows/GestionalePreventivi.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Calcola SHA-256
        shell: pwsh
        run: |
          $installer = "dist-installer/Gestionale Preventivi 1.0 Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer non generato" }
          (Get-FileHash $installer -Algorithm SHA256).Hash + "  Gestionale Preventivi 1.0 Setup.exe" | Set-Content "dist-installer/SHA256SUMS.txt"
          Copy-Item "docs/INSTALLAZIONE_WINDOWS.md" "dist-installer/ISTRUZIONI.txt"

      - name: Carica installer e hash
        uses: actions/upload-artifact@v4
        with:
          name: Gestionale-Preventivi-1.0-Windows-x64
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 30
